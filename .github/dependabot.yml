# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

# We're adding `[FAST_BUILD]` prefix to commit messages (this adds it to PR title)
# This triggers a faster build, see more info in `.github/workflows/docker.yml`

version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/apply-single-tags/
      - /.github/actions/create-dev-env/
      - /.github/actions/load-image/
    schedule:
      interval: weekly
    commit-message:
      prefix: "[FAST_BUILD] "
    groups:
      github-actions:
        patterns:
          - "*"
  # This action is only used for some images, so full build is required
  - package-ecosystem: github-actions
    directory: .github/actions/free-disk-space/
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: .devcontainer/
    schedule:
      interval: weekly
    commit-message:
      prefix: "[FAST_BUILD] "
  - package-ecosystem: docker
    directory: images/docker-stacks-foundation/
    schedule:
      interval: weekly
  # Dev dependencies are used to test all the images, so full build is required
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns:
          - "*"
