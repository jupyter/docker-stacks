name: Download a Docker image and its tags from GitHub artifacts, apply them, and push the image to the Registry

env:
  REGISTRY: quay.io
  OWNER: ${{ github.repository_owner }}
  PUSH_TO_REGISTRY: ${{ (github.repository_owner == 'jupyter' || github.repository_owner == 'mathbunnyru') && (github.ref == 'refs/heads/main' || github.event_name == 'schedule') }}

on:
  workflow_call:
    inputs:
      image:
        description: Image name
        required: true
        type: string
      variant:
        description: Variant tag prefix
        required: true
        type: string
      timeout-minutes:
        description: Timeout in minutes
        default: 25
        type: number
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_TOKEN:
        required: true

permissions: {}

jobs:
  tag-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      matrix:
        platform: [aarch64, x86_64]

    steps:
      - name: Checkout Repo ⚡️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space 🧹
        uses: ./.github/actions/free-disk-space
        if: contains(inputs.variant, 'cuda') || inputs.image == 'datascience-notebook' || inputs.image == 'all-spark-notebook'
      - name: Create dev environment 📦
        uses: ./.github/actions/create-dev-env

      - name: Download image tar and apply tags 🏷
        uses: ./.github/actions/apply-single-tags
        with:
          image: ${{ inputs.image }}
          variant: ${{ inputs.variant }}
          platform: ${{ matrix.platform }}

      - name: Login to Registry 🔐
        if: env.PUSH_TO_REGISTRY == 'true'
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "${REGISTRY_TOKEN}" | docker login ${{ env.REGISTRY }} \
            --username "${REGISTRY_USERNAME}" \
            --password-stdin || \
          (sleep 10 && \
          echo "${REGISTRY_TOKEN}" | docker login ${{ env.REGISTRY }} \
            --username "${REGISTRY_USERNAME}" \
            --password-stdin)
        shell: bash
        id: login

      - name: Push single platform images to Registry 📤
        if: env.PUSH_TO_REGISTRY == 'true'
        run: |
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }} || \
          (sleep 10 && \
          docker push --all-tags ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ inputs.image }})
        shell: bash

      - name: Install Cosign 🔏
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Calculate image ref 🔑
        run: |
          IMAGE_REF=$(python3 -m tagging.apps.calculate_image_ref \
            --image ${{ inputs.image }} \
            --variant ${{ inputs.variant }} \
            --platform ${{ matrix.platform }} \
            --tags-dir /tmp/jupyter/tags/)
          echo "IMAGE_REF=${IMAGE_REF}" >> "${GITHUB_ENV}"
        shell: bash

      # The bundle format stores the signature using OCI 1.1 referrers and requires cosign v3+ to verify
      - name: Sign single platform image with Cosign 🔏
        if: env.PUSH_TO_REGISTRY == 'true'
        run: cosign sign --yes --new-bundle-format=true "${IMAGE_REF}"
        shell: bash

      - name: Logout from Registry 🔐
        if: always() && env.PUSH_TO_REGISTRY == 'true' && steps.login.outcome == 'success'
        run: |
          docker logout ${{ env.REGISTRY }}
        shell: bash
