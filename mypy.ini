# Mypy is an optional static type checker for Python that aims to combine
# the benefits of dynamic (or "duck") typing and static typing.
#
# Documentation: https://www.mypy-lang.org
# Project: https://github.com/python/mypy
# Config reference: https://mypy.readthedocs.io/en/stable/config_file.html
#
# We use mypy as part of pre-commit checks

[mypy]
python_version = 3.12
follow_imports = error
strict = True
no_incremental = True
warn_unreachable = True
disallow_any_unimported = True
enable_error_code = deprecated, exhaustive-match, ignore-without-code, mutable-override, possibly-undefined, redundant-expr, redundant-self, truthy-bool, truthy-iterable, unimported-reveal, unused-awaitable

# These packages are statically typed and are installed in the pre-commit mypy environment,
# so we follow their imports to get real types instead of Any

[mypy-jupyter_core.*]
follow_imports = silent

[mypy-plumbum.*]
follow_imports = silent

[mypy-pytest.*]
follow_imports = silent

[mypy-_pytest.*]
follow_imports = silent

[mypy-tenacity.*]
follow_imports = silent

# These sections allow us to ignore mypy errors for packages
# which are not (hopefully yet) statically typed

[mypy-Cython.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-pyspark.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True
